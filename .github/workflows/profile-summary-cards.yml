name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 0-profile-details and 3-stats read your user-level contribution
          # totals, which the default GITHUB_TOKEN cannot see -- it is scoped
          # to this repo only, so those two cards silently fail to generate.
          # Create a classic PAT with `read:user` + `repo` scope and save it as
          # a repo secret named SUMMARY_GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          AUTO_PUSH: true
          THEME: "tokyonight"
