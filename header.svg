<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi there! I'm Dhruv Patel">
  <defs>
    <clipPath id="clip-cmd">
      <rect x="79.2" y="60" width="0" height="36">
        <animate attributeName="width" calcMode="discrete" values="0.0;0.0;15.6;31.2;46.8;62.4;78.0;93.6;93.6;0.0" keyTimes="0.0;0.022222;0.044444;0.066667;0.088889;0.111111;0.133333;0.155556;0.965;1.0" dur="9.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="clip-out">
      <rect x="48" y="98" width="0" height="36">
        <animate attributeName="width" calcMode="discrete" values="0.0;0.0;15.6;31.2;46.8;62.4;78.0;93.6;109.2;124.8;140.4;156.0;171.6;187.2;202.8;218.4;234.0;249.6;265.2;280.8;296.4;312.0;327.6;343.2;358.8;374.4;390.0;390.0;0.0" keyTimes="0.0;0.233333;0.244444;0.255556;0.266667;0.277778;0.288889;0.3;0.311111;0.322222;0.333333;0.344444;0.355556;0.366667;0.377778;0.388889;0.4;0.411111;0.422222;0.433333;0.444444;0.455556;0.466667;0.477778;0.488889;0.5;0.511111;0.965;1.0" dur="9.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .blink { animation: blink 1.06s steps(1, end) infinite; }
      @keyframes blink { 0%, 55% { opacity: 0.9; } 56%, 100% { opacity: 0; } }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- window chrome -->
  <rect x="16" y="12" width="768" height="176" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M16 24a12 12 0 0 1 12-12h744a12 12 0 0 1 12 12v22H16z" fill="#161b22"/>
  <line x1="16" y1="46" x2="784" y2="46" stroke="#30363d"/>
  <circle cx="40" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="60" cy="29" r="6" fill="#febc2e"/>
  <circle cx="80" cy="29" r="6" fill="#28c840"/>
  <text class="mono" x="400" y="34" font-size="13" fill="#8b949e" text-anchor="middle">dhruv@github: ~</text>

  <!-- $ whoami -->
  <text class="mono" x="48" y="86" font-size="26" fill="#7ee787">$</text>
  <g clip-path="url(#clip-cmd)">
    <text class="mono" x="79.2" y="86" font-size="26" fill="#c9d1d9">whoami</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.2111" dur="9.0s" repeatCount="indefinite"/>
    <rect class="blink" x="79.2" y="66" width="15.6" height="26" fill="#7ee787">
      <animate attributeName="x" calcMode="discrete" values="79.2;79.2;94.8;110.4;126.0;141.6;157.2;172.8;172.8;79.2" keyTimes="0.0;0.022222;0.044444;0.066667;0.088889;0.111111;0.133333;0.155556;0.965;1.0" dur="9.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- output line -->
  <g clip-path="url(#clip-out)">
    <text class="mono" x="48" y="124" font-size="26" font-weight="600" fill="#c9d1d9">Hi there! I'm <tspan fill="#58a6ff">Dhruv Patel</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2111;0.5222" dur="9.0s" repeatCount="indefinite"/>
    <rect class="blink" x="48" y="104" width="15.6" height="26" fill="#7ee787">
      <animate attributeName="x" calcMode="discrete" values="48.0;48.0;63.6;79.2;94.8;110.4;126.0;141.6;157.2;172.8;188.4;204.0;219.6;235.2;250.8;266.4;282.0;297.6;313.2;328.8;344.4;360.0;375.6;391.2;406.8;422.4;438.0;438.0;48.0" keyTimes="0.0;0.233333;0.244444;0.255556;0.266667;0.277778;0.288889;0.3;0.311111;0.322222;0.333333;0.344444;0.355556;0.366667;0.377778;0.388889;0.4;0.411111;0.422222;0.433333;0.444444;0.455556;0.466667;0.477778;0.488889;0.5;0.511111;0.965;1.0" dur="9.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- waving hand once the line lands -->
  <g opacity="0" transform="translate(466, 122)">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5111;0.965" dur="9.0s" repeatCount="indefinite"/>
    <text x="0" y="0" font-size="30" text-anchor="middle">👋
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 -9; 0 0 -9; 22 0 -9; -10 0 -9; 20 0 -9; 0 0 -9; 0 0 -9"
        keyTimes="0;0.5111;0.5278;0.5444;0.5611;0.5778;1"
        dur="9.0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- fresh prompt, waiting -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5444;0.965" dur="9.0s" repeatCount="indefinite"/>
    <text class="mono" x="48" y="162" font-size="26" fill="#7ee787">$</text>
    <rect class="blink" x="79.2" y="142" width="15.6" height="26" fill="#7ee787"/>
  </g>
</svg>
